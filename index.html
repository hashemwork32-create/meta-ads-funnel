<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qualify Your Business - Meta Ads Strategy</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: #f8f8f6;
            color: #2a2a2a;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 3rem 1rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeIn 0.6s ease-in-out;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: #1a1a1a;
            margin-bottom: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 1.125rem;
            color: #8b9a8f;
            font-weight: 300;
        }

        .progress-section {
            margin-bottom: 3rem;
            animation: fadeIn 0.6s ease-in-out;
            animation-delay: 0.1s;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .progress-header span {
            font-size: 0.875rem;
            font-weight: 600;
            color: #1a1a1a;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: #efefeb;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: #d4af37;
            transition: width 0.5s ease-in-out;
        }

        .form-section {
            animation: fadeIn 0.6s ease-in-out;
            animation-delay: 0.2s;
        }

        .question-card {
            background: white;
            border: 1px solid #e8e8e4;
            border-radius: 0.5rem;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .question-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            color: #1a1a1a;
            margin-bottom: 1.5rem;
            font-weight: 700;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
        }

        .radio-option input[type="radio"] {
            width: 1rem;
            height: 1rem;
            cursor: pointer;
            accent-color: #d4af37;
        }

        .radio-option label {
            cursor: pointer;
            color: #2a2a2a;
            transition: color 0.2s ease-in-out;
            font-size: 1rem;
        }

        .radio-option:hover label {
            color: #d4af37;
        }

        .error-message {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 1rem;
        }

        .submit-btn {
            width: 100%;
            padding: 0.75rem 2rem;
            background-color: #d4af37;
            color: #1a1a1a;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            margin-top: 2rem;
            font-family: 'Lato', sans-serif;
        }

        .submit-btn:hover:not(:disabled) {
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
            transform: scale(1.02);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .fade-in {
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .question-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Qualify Your Business</h1>
            <p>Help me understand your brand better so i can create a personalized strategy</p>
        </div>

        <div class="progress-section">
            <div class="progress-header">
                <span>Progress</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <form id="surveyForm" class="form-section">
            <!-- Question cards unchanged -->
            <!-- ... (كل الأسئلة كما هي بدون أي تغيير) ... -->

            <button type="submit" class="submit-btn" id="submitBtn">Book Your Strategy Call</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('surveyForm');
        const submitBtn = document.getElementById('submitBtn');
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');

        const questions = ['socialMedia', 'monthlyRevenue', 'adSpend', 'revenueTarget', 'marketingChallenge'];

        function updateProgress() {
            let answered = 0;
            questions.forEach(q => {
                if (document.querySelector(`input[name="${q}"]:checked`)) {
                    answered++;
                }
            });
            const percentage = (answered / questions.length) * 100;
            progressFill.style.width = percentage + '%';
            progressPercent.textContent = Math.round(percentage) + '%';
        }

        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', function() {
                updateProgress();
                const errorElement = document.getElementById(`error_${this.name}`);
                if (errorElement) {
                    errorElement.textContent = '';
                }
            });
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            let isValid = true;
            const answers = {};

            questions.forEach(q => {
                const checked = document.querySelector(`input[name="${q}"]:checked`);
                const errorElement = document.getElementById(`error_${q}`);

                if (!checked) {
                    errorElement.textContent = `Please select an option`;
                    isValid = false;
                } else {
                    answers[q] = checked.value;
                    errorElement.textContent = '';
                }
            });

            if (isValid) {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Processing...';

                fetch("https://script.google.com/macros/s/AKfycbyMTo8i_TSk3mAfYN4HcdWJepEAavxh2ViSc8a_lCqHsnYhGbICfZsmMWSYqJNx3inntA/exec", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        socialMedia: answers.socialMedia,
                        averageMonthlyRevenue: answers.monthlyRevenue,
                        adSpend: answers.adSpend,
                        revenueTarget: answers.revenueTarget,
                        marketingChallenge: answers.marketingChallenge,
                        timestamp: new Date().toISOString()
                    })
                });

                const leadData = JSON.parse(localStorage.getItem('leadData') || '{}');
                const completeData = { ...leadData, ...answers };
                localStorage.setItem('leadData', JSON.stringify(completeData));

                setTimeout(() => {
                    window.location.href = '/booking';
                }, 500);
            }
        });

        updateProgress();
    </script>
</body>
</html>
