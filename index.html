<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qualify Your Business - Meta Ads Strategy</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;600&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Lato', sans-serif;
  background-color: #f8f8f6;
  color: #2a2a2a;
}
.container { max-width: 800px; margin: auto; padding: 3rem 1rem; }
.header { text-align: center; margin-bottom: 3rem; }
.progress-bar { height: 4px; background: #efefeb; }
.progress-fill { height: 100%; background: #d4af37; width: 0%; }
.question-card {
  background: white; border: 1px solid #e8e8e4;
  border-radius: 8px; padding: 2rem; margin-bottom: 2rem;
}
.radio-group { display: flex; flex-direction: column; gap: 1rem; }
input[type="radio"] { accent-color: #d4af37; }
input[type="text"] { width: 100%; padding: 0.75rem; }
.error-message { color: #ef4444; font-size: 0.875rem; }
.submit-btn {
  width: 100%; padding: 0.75rem;
  background: #d4af37; border: none;
  font-weight: 600; cursor: pointer;
}
</style>
</head>

<body>
<div class="container">

<div class="header">
  <h1>Qualify Your Business</h1>
  <p>Help me understand your brand better so I can create a personalized strategy</p>
</div>

<div class="progress-bar">
  <div class="progress-fill" id="progressFill"></div>
</div>

<form id="surveyForm">

<!-- QUESTIONS (unchanged) -->
<div class="question-card">
<h3>What is your most active social media page?</h3>
<div class="radio-group">
<label><input type="radio" name="socialMedia" value="Instagram"> Instagram</label>
<label><input type="radio" name="socialMedia" value="Facebook"> Facebook</label>
<label><input type="radio" name="socialMedia" value="TikTok"> TikTok</label>
<label><input type="radio" name="socialMedia" value="Pinterest"> Pinterest</label>
<label><input type="radio" name="socialMedia" value="Other"> Other</label>
</div>
</div>

<div class="question-card">
<h3>Average monthly revenue?</h3>
<div class="radio-group">
<label><input type="radio" name="monthlyRevenue" value="$0 - $10,000">$0 - $10,000</label>
<label><input type="radio" name="monthlyRevenue" value="$10,000 - $50,000">$10,000 - $50,000</label>
<label><input type="radio" name="monthlyRevenue" value="$50,000 - $100,000">$50,000 - $100,000</label>
<label><input type="radio" name="monthlyRevenue" value="$100,000 - $250,000">$100,000 - $250,000</label>
<label><input type="radio" name="monthlyRevenue" value="$250,000+">$250,000+</label>
</div>
</div>

<div class="question-card">
<h3>Monthly ad spend?</h3>
<div class="radio-group">
<label><input type="radio" name="adSpend" value="$0 - $1,000">$0 - $1,000</label>
<label><input type="radio" name="adSpend" value="$1,000 - $5,000">$1,000 - $5,000</label>
<label><input type="radio" name="adSpend" value="$5,000 - $10,000">$5,000 - $10,000</label>
<label><input type="radio" name="adSpend" value="$10,000 - $25,000">$10,000 - $25,000</label>
<label><input type="radio" name="adSpend" value="$25,000+">$25,000+</label>
</div>
</div>

<div class="question-card">
<h3>Revenue target?</h3>
<input type="text" name="revenueTarget" placeholder="$75,000">
</div>

<div class="question-card">
<h3>Biggest marketing challenge?</h3>
<div class="radio-group">
<label><input type="radio" name="marketingChallenge" value="Low conversion rates">Low conversion rates</label>
<label><input type="radio" name="marketingChallenge" value="High CPA">High CPA</label>
<label><input type="radio" name="marketingChallenge" value="Poor targeting">Poor targeting</label>
<label><input type="radio" name="marketingChallenge" value="Ad fatigue">Ad fatigue</label>
</div>
</div>

<button type="submit" class="submit-btn">Book Your Strategy Call</button>
</form>
</div>

<script>
const form = document.getElementById("surveyForm");
const progressFill = document.getElementById("progressFill");
const fields = ["socialMedia","monthlyRevenue","adSpend","revenueTarget","marketingChallenge"];

form.addEventListener("input", () => {
  let filled = fields.filter(f =>
    f === "revenueTarget"
      ? form.revenueTarget.value.trim()
      : document.querySelector(`input[name="${f}"]:checked`)
  ).length;
  progressFill.style.width = (filled / fields.length * 100) + "%";
});

form.addEventListener("submit", e => {
  e.preventDefault();

  const data = {
    socialMedia: form.socialMedia.value,
    averageMonthlyRevenue: form.monthlyRevenue.value,
    adSpend: form.adSpend.value,
    revenueTarget: form.revenueTarget.value,
    marketingChallenge: form.marketingChallenge.value,
    timestamp: new Date().toISOString()
  };

  fetch("https://script.google.com/macros/s/AKfycbyMTo8i_TSk3mAfYN4HcdWJepEAavxh2ViSc8a_lCqHsnYhGbICfZsmMWSYqJNx3inntA/exec", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  }).then(() => {
    window.location.href = "https://calendly.com/YOUR-CALENDLY-LINK";
  });
});
</script>

</body>
</html>
