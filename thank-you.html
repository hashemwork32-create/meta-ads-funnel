<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Booking Confirmed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f8f6;
      color: #1a1a1a;
    }

    .wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      padding: 50px 40px;
      border-radius: 16px;
      text-align: center;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    }

    .check {
      width: 80px;
      height: 80px;
      margin: 0 auto 25px;
      border-radius: 50%;
      background: #2ecc71;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 42px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 28px;
    }

    p {
      margin: 0;
      font-size: 16px;
      line-height: 1.6;
      color: #6b6b6b;
    }
  </style>
</head>

<body>

  <div class="wrapper">
    <div class="card">
      <div class="check">✓</div>
      <h1>Thank you for booking</h1>
      <p>
        Your call is confirmed.<br>
        You’ll receive the meeting details by email shortly.
      </p>
    </div>
  </div>

</body>
</html>
